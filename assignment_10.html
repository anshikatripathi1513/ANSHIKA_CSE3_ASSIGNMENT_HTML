<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 10 - Multimedia</title>
</head>
<body>
    <h3>Image</h3>
    <img src="campus.jpg" alt="College campus" width="200" height="180">

    <h3>Video</h3>
    <video width="250" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h3>Audio</h3>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h3>YouTube</h3>
    <iframe width="350" height="220" src="https://youtube.com" title="YouTube video player" allowfullscreen></iframe>
</body>
</html>
